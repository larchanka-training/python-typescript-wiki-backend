services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: wiki
    ports:
      # Host port 5433 -> container 5432 (use localhost:5433 in pgAdmin).
      - "5433:5432"
    volumes:
      - psql-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d wiki" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://admin:admin123@db:5432/wiki
      OAUTH_NAME_APPLICATION_ID: ${OAUTH_NAME_APPLICATION_ID:-local-app}
      OAUTH_NAME_SECRET_KEY: ${OAUTH_NAME_SECRET_KEY:-local-secret}
      TOKEN_TTL_SECONDS: ${TOKEN_TTL_SECONDS:-86400}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      ENVIRONMENT: ${ENVIRONMENT:-Development}
      TEST_TOKEN: ${TEST_TOKEN:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Apply migrations on container start, then run the API server.
    command: >
      sh -c "alembic upgrade head &&
             fastapi dev app/main.py --host 0.0.0.0 --port 8000"

volumes:
  psql-data:
