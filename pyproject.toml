[tool.ruff]
line-length = 120
fix = true
show-fixes = true

extend-exclude = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
extend-select = [
    "ALL",
]
extend-ignore = [
    # Missing docstring.
    "D1",
    # flake8-future-annotations.
    "FA",
    # Missing type annotation for self and cls.
    "ANN1",
    # f-strings to format logging messages.
    "G004",
    # Consider {expression} instead of string join.
    "FLY002",
    # TODOs
    # Author.
    "TD002",
    # Link to issue
    "TD003",
    # Line contains a TODO or related comment
    "FIX",
    # Args and kwargs are not used and not annotated
    "ANN002",
    "ANN003",
    # Commented code
    "ERA001",
    # empty-comment
    "PLR2044",
    # print used.
    "T201",
    # Conflicts with formatter
    "COM812",
    "ISC001",
]

task-tags = [
    "TODO",
    "FIXME",
    "HACK",
    "XXX",
    "[",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = [
    # Unused import.
    "F401",
]

"test_*.py" = [
    # Allow `assert` statements in tests.
    "S101",
    # Magic values in tests are acceptable.
    "PLR2004",
    # Docstrings in tests don't need periods.
    "D415",
    # String literals in exceptions in tests are acceptable.
    "EM101",
    # Long exception messages in tests are acceptable.
    "TRY003",
]

"app/db.py" = [
    # Request is used in runtime for FastAPI dependency injection.
    "TC002",
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "fastapi.FastAPI",
]
runtime-evaluated-decorators = [
    "pydantic.validate_call",
    "fastapi.get",
    "fastapi.post",
    "fastapi.put",
    "fastapi.delete",
    "fastapi.patch",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Suppress deprecated asyncio.iscoroutinefunction from slowapi (Python 3.14+)
    # This is a third-party library issue, will be fixed in future slowapi releases
    "ignore:.*iscoroutinefunction.*:DeprecationWarning:slowapi",
]
